  <text x="50" y="191" fill="#181c20" font-family="Georgia, 'Times New Roman', serif" font-size="70" letter-spacing="-3">Shoulders <tspan font-style="italic" fill="#24527a">of</tspan> Giants</text>
  <text x="54" y="241" fill="#26333d" font-family="'Malgun Gothic', 'Noto Sans KR', Arial, sans-serif" font-size="25" font-weight="500">거장의 어깨 위에서, 포트폴리오를 읽다.</text>
  <text x="54" y="277" fill="#60707c" font-family="'Malgun Gothic', 'Noto Sans KR', Arial, sans-serif" font-size="15">성과 분석 · 투자자 아카이브 · 예산 배분 · 포지션 변화</text>
