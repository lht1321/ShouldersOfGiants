  <text x="77" y="37" fill="#181c20" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">SHOULDERS <tspan font-family="Georgia, serif" font-style="italic" font-weight="400" letter-spacing="0">of</tspan> GIANTS</text>
  <text x="1164" y="37" text-anchor="end" fill="#60707c" font-family="Consolas, monospace" font-size="11" letter-spacing="1.5">PUBLIC FILINGS. THOUGHTFUL RESEARCH.</text>
